name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backends to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            # BOT 1
            cd /root/kakos-tur-agent/bot-1/tur_agent_bot
            git pull origin main
            npm ci
            npm run build
            PORT=3000 pm2 restart bot-1-back --update-env || PORT=3000 pm2 start dist/main.js --name bot-1-back
            pm2 save

            # BOT 2
            cd /root/kakos-tur-agent/bot-2/tur_agent_bot
            git pull origin main
            npm ci
            npm run build
            PORT=3001 pm2 restart bot-2-back --update-env || PORT=3001 pm2 start dist/main.js --name bot-2-back
            pm2 save