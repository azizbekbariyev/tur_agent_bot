name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd tur_agent_bot

            git fetch origin
            git reset --hard origin/main

            npm install

            npm run build

            pm2 restart tur-agent-back || pm2 start dist/main.js --name tur-agent-back

            pm2 save